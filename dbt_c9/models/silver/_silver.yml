version: 2

models:
  - name: dim_products
    description: Một dòng là một sản phẩm.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: cost
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cost <= retail_price"
          config:
            where: "cost is not null and retail_price is not null"
            severity: warn
  - name: dim_products_type1
    description: Sản phẩm ở trạng thái hiện tại, mỗi sản phẩm một dòng (lọc dòng đang mở của products_snapshot)
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_products_type2
    description: Mọi phiên bản của sản phẩm (SCD Type 2), đọc từ products_snapshot
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null
      - name: product_id
        data_tests:
          - not_null
  - name: dim_users
    description: Một dòng là một khách hàng.
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
      - name: age
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                severity: warn
      - name: email
        data_tests:
          - unique:
              config:
                severity: warn
  - name: fact_orders
    description: Một dòng là một phiên bản của đơn hàng. Một đơn có nhiều dòng nếu bị sửa.
    columns:
      - name: order_key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Cancelled', 'Complete', 'Processing', 'Returned', 'Shipped']
  - name: fact_order_items
    description: Một dòng là một phiên bản của món hàng trong đơn, kèm amount và total_cost.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount = sale_price * quantity"
    columns:
      - name: order_item_key
        data_tests:
          - unique
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
  - name: fact_shipments
    description: Một dòng là một lô giao hàng.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delivered_at >= shipped_at"
          config:
            where: "delivered_at is not null and shipped_at is not null"
    columns:
      - name: shipment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
  - name: dim_users_type2
    description: Mọi phiên bản lịch sử của khách hàng (SCD Type 2), đọc từ users_snapshot.
    columns:
      - name: user_key
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null  