snapshots:
  - name: users_snapshot
    relation: ref('users_latest')
    config:
      unique_key: id
      strategy: check
      # Chọn các cột thuộc tính cá nhân và địa chỉ của người dùng có thể thay đổi theo thời gian (first_name, last_name, email, age, gender, country, state, city, street_address, postal_code).
      # Bỏ id, created_at, traffic_source (thuộc tính gốc lúc đăng ký không đổi), bỏ latitude/longitude (số thực dễ lệch sai số làm tròn và phụ thuộc vào địa chỉ), bỏ updated_at và _airbyte_* (metadata hệ thống).
      check_cols:
        - first_name
        - last_name
        - email
        - age
        - gender
        - country
        - state
        - city
        - street_address
        - postal_code
      updated_at: updated_at
      snapshot_meta_column_names:
        dbt_valid_from: valid_from
        dbt_valid_to: valid_to
        dbt_scd_id: scd_id
        dbt_updated_at: snapshot_updated_at